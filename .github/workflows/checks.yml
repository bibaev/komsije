# Проверки PR: тесты, линтер и пробная сборка из живой таблицы (ловит ошибки в data/overrides.json).
# Ничего не публикует: деплой идёт только из main (pages.yml).
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
      - name: Пробная сборка
        run: python -m komsije.build | tee -a "$GITHUB_STEP_SUMMARY"
